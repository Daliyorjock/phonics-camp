.ex-zh{color:#999;font-size:11px;white-space:nowrap}

.ex-speak:hover{opacity:1}
.quiz-hint{font-size:11px;color:#bbb;text-align:center;padding:8px 0 2px;cursor:pointer}

.quiz-fb.bad{color:#e74c3c}

.search-wrap input::placeholder{color:#bbb}

  c.classList.toggle('expanded');
}

function speakWord(w){
  if(window.speechSynthesis){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(w);
    u.lang='en-US';
    u.rate=0.82;
    window.speechSynthesis.speak(u);
  }
}

function startQuiz(id){
  var card=document.getElementById('uc-'+id);
  if(!card||card.classList.contains('quizzing'))return;
  card.classList.add('quizzing');
  card.classList.add('expanded');
}

function answerQuiz(id,meaning,wrong){
  var fb=document.getElementById('qzfb-'+id);
  if(!fb)return;
  fb.classList.add('show');
  fb.className='quiz-fb show '+(wrong?'bad':'good');
  fb.textContent=wrong?'再想想，正确答案在释义里 👆':'✅ 正确！'+getEmoji();
  completed[id]=true;
  var qc=document.getElementById('qc-'+id);
  if(qc)qc.style.display='none';
  updateScore();
}

function getEmoji(){
  var e=['🌟','🎉','👏','💪','🔥','💡','✨'];
  return e[Math.floor(Math.random()*e.length)];
}

function updateScore(){
  var total=MORPHEMES.filter(function(m){return m.type===currentTab;}).length;
  var done=0;
  MORPHEMES.forEach(function(m){if(m.type===currentTab&&completed[m.id])done++;});
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressNum').textContent=done+'/'+total;
}

function switchTab(type){
  currentTab=type;
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    var t=b.textContent.trim();
    b.classList.toggle('active',
      (i===0&&type==='prefix')||(i===1&&type==='suffix')||(i===2&&type==='root'));
  });
  renderUnits();
  updateScore();
}

function renderUnits(){
  var list=document.getElementById('unitList');
  var data=MORPHEMES.filter(function(m){return m.type===currentTab;});
  var typeIcon={prefix:'🔷',suffix:'🔰',root:'🧱'};
  var typeColor={prefix:'prefix',suffix:'suffix',root:'root'};
  var html='';
  data.forEach(function(m){
    var encId=m.id.replace(/'/g,"\\'");
    var escMeaning=m.meaning.replace(/'/g,"\\'");
    var allMeanings=MORPHEMES.filter(function(x){return x.type===m.type&&x.id!==m.id;}).map(function(x){return x.meaning;})
      .sort(function(){return Math.random()-0.5;}).slice(0,3);
    allMeanings.push(m.meaning);
    allMeanings.sort(function(){return Math.random()-0.5;});
    html+='<div class="unit-card" id="uc-'+m.id+'">';
    html+='<div class="unit-head" onclick="toggleUnit(\''+encId+'\')">';
    html+='<div class="unit-icon '+typeColor[m.type]+'">'+typeIcon[m.type]+'</div>';
    html+='<div class="unit-main"><div class="unit-form">'+escHtml(m.form)+'</div>';
    html+='<div class="unit-meaning">'+escHtml(m.meaning)+'</div></div>';
    html+='<div class="unit-meta">'+m.words.length+'词</div>';
    html+='<div class="unit-arrow">▾</div></div>';
    html+='<div class="unit-body">';
    html+='<div class="unit-desc">💡 '+escHtml(m.desc)+'</div>';
    html+='<div class="unit-label">📝 拓展词</div>';
    html+='<div class="word-chips">';
    m.words.forEach(function(w){
      var we=w.replace(/'/g,"\\'");
      html+='<span class="word-chip" onclick="event.stopPropagation();speakWord(\''+we+'\')">'+escHtml(w)+' <span class="chip-speak">🔊</span></span>';
    });
    html+='</div><div class="unit-label">📖 例句</div><div class="ex-list">';
    m.sentences.forEach(function(s){
      var se=s[0].replace(/'/g,"\\'");
      html+='<div class="ex-item"><span class="ex-en">'+escHtml(s[0])+'</span><span class="ex-zh">'+escHtml(s[1])+'</span><span class="ex-speak" onclick="event.stopPropagation();speakWord(\''+se+'\')">🔊</span></div>';
    });
    html+='</div><div id="qc-'+m.id+'">';
    html+='<div class="quiz-hint" onclick="event.stopPropagation();startQuiz(\''+encId+'\')">🎯 测验一下</div>';
    html+='<div class="unit-quiz"><div class="quiz-q">'+escHtml(m.form)+' 表示什么？</div>';
    html+='<div class="quiz-options">';
    allMeanings.forEach(function(opt){
      var oe=opt.replace(/'/g,"\\'");
      html+='<span class="quiz-opt" onclick="event.stopPropagation();answerQuiz(\''+encId+'\',\''+oe+'\','+(opt!==m.meaning)+')">'+escHtml(opt)+'</span>';
    });
    html+='</div><div class="quiz-fb" id="qzfb-'+m.id+'"></div></div></div></div></div>';
  });
  if(!data.length)html='<div class="empty-msg">暂无该分类的词根词缀</div>';
  list.innerHTML=html;
  ['prefix','suffix','root'].forEach(function(t){
    var cnt=MORPHEMES.filter(function(m){return m.type===t;}).length;
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      var txt=btn.textContent.trim();
      if((t==='prefix'&&txt.indexOf('前缀')!==-1)||(t==='suffix'&&txt.indexOf('后缀')!==-1)||(t==='root'&&txt.indexOf('词根')!==-1)){
        var el=btn.querySelector('.tab-count');
        if(el)el.textContent=cnt+'个';
      }
    });
  });
}


function doSearch(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){
    renderUnits();
    updateScore();
    return;
  }
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  var results=MORPHEMES.filter(function(m){
    if(m.form.toLowerCase().indexOf(q)>=0)return true;
    if(m.meaning.toLowerCase().indexOf(q)>=0)return true;
    if(m.desc.toLowerCase().indexOf(q)>=0)return true;
    for(var i=0;i<m.words.length;i++){if(m.words[i].toLowerCase().indexOf(q)>=0)return true;}
    for(var i=0;i<m.sentences.length;i++){if(m.sentences[i][0].toLowerCase().indexOf(q)>=0)return true;}
    return false;
  });
  document.getElementById('progressNum').textContent=results.length+'个';
  document.getElementById('progressFill').style.width='0%';
  searchRender(results);
}

    });
    html+='</div><div class="unit-label">📖 例句</div><div class="ex-list">';

      var se=s[0].replace(/'/g,"\\'");
      html+='<div class="ex-item"><span class="ex-en">'+escHtml(s[0])+'</span><span class="ex-zh">'+escHtml(s[1])+'</span><span class="ex-speak" onclick="event.stopPropagation();speakWord(\''+se+'\')">🔊</span></div>';
    });
    html+='</div><div id="qc-'+m.id+'">';
    html+='<div class="quiz-hint" onclick="event.stopPropagation();startQuiz(\''+encId+'\')">🎯 测验一下</div>';
    html+='<div class="unit-quiz"><div class="quiz-q">'+escHtml(m.form)+' 表示什么？</div>';
    html+='<div class="quiz-options">';
    allMeanings.forEach(function(opt){
      var oe=opt.replace(/'/g,"\\'");
      html+='<span class="quiz-opt" onclick="event.stopPropagation();answerQuiz(\''+encId+'\',\''+oe+'\','+(opt!==m.meaning)+')">'+escHtml(opt)+'</span>';
    });
    html+='</div><div class="quiz-fb" id="qzfb-'+m.id+'"></div></div></div></div></div>';
  });
  if(!data.length)html='<div class="empty-msg">未找到匹配的词根词缀</div>';
  list.innerHTML=html;
}
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

(function(){
  MORPHEMES=JSON.parse(document.getElementById('morphData').textContent);
  switchTab('prefix');
  updateScore();
})();
</script>
