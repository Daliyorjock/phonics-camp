<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DeepLingual · 词根词缀训练营</title>
<style>
:root{--p:#7c5ce7;--g:#00b894;--t:#1e1e2e;--td:#666;--bg:#f7f5ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;-webkit-tap-highlight-color:transparent}
.main{display:flex;flex-direction:column;align-items:center;padding:16px 12px 24px;max-width:460px;margin:0 auto}
.camp{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.07);width:100%;overflow:hidden}
.banner{background:linear-gradient(135deg,var(--p),#8b6ef0);padding:12px 16px 10px;color:#fff;text-align:center}
.banner .title{font-size:16px;font-weight:800;margin-bottom:1px}
.banner .sub{font-size:11px;opacity:.8}
.tabs{display:flex;gap:0;background:#fafaff;border-bottom:1px solid #ece6ff}
.tab{flex:1;border:0;padding:9px 6px;font-size:12px;font-weight:600;background:transparent;color:#999;cursor:pointer;border-bottom:2px solid transparent;text-align:center;transition:.15s}
.tab.active{color:var(--p);border-bottom-color:var(--p)}
.tab .cnt{font-size:10px;color:#bbb;margin-top:1px}
.pbar{display:flex;align-items:center;gap:8px;padding:6px 16px}
.pbar .pt{flex:1;height:4px;background:#e8e8e8;border-radius:2px;overflow:hidden}
.pbar .pf{height:100%;background:linear-gradient(90deg,var(--p),var(--g));border-radius:2px;transition:width .35s}
.pbar .pn{font-size:11px;font-weight:700;color:#aaa;min-width:36px;text-align:right}
.cbody{padding:18px 16px 16px}
.cbody .badge{font-size:10px;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.cbody .word{font-size:28px;font-weight:900;color:var(--t);letter-spacing:.5px;line-height:1.3;margin-bottom:2px}
.cbody .meaning{font-size:14px;color:var(--td);font-weight:600;margin-bottom:10px}
.cbody .desc{font-size:12px;color:#777;line-height:1.7;background:#faf8ff;border-radius:8px;padding:9px 10px;margin-bottom:12px}
.cbody .slabel{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.cbody .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.cbody .chip{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;background:#f5f2ff;border-radius:14px;font-size:13px;font-weight:600;color:var(--p);cursor:pointer;border:1px solid #ece6ff;transition:.1s}
.cbody .chip:active{transform:scale(.96);background:#ede4ff}
.cbody .chip .ik{font-size:9px;opacity:.4}
.cbody .exlist{display:flex;flex-direction:column;gap:3px;margin-bottom:4px}
.cbody .exrow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fafafa;border-radius:8px;font-size:12px}
.cbody .exen{font-weight:600;color:#333;flex:1;line-height:1.5}
.cbody .exzh{color:#999;font-size:11px;white-space:nowrap}
.cbody .exspk{cursor:pointer;opacity:.3;font-size:14px;flex-shrink:0}
.cbody .exspk:active{opacity:1}
.cbody .nav{display:flex;align-items:center;margin-top:14px;gap:8px}
.cbody .btn-learn{flex:1;padding:10px;border:0;border-radius:18px;background:var(--p);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.1s}
.cbody .btn-learn:active{transform:scale(.98);opacity:.85}
.cbody .btn-back{border:0;background:transparent;color:#bbb;font-size:13px;padding:8px;cursor:pointer;flex-shrink:0}
.cbody .btn-back:active{color:#999}
.cbody .btn-fwd{border:0;background:transparent;color:var(--p);font-size:13px;padding:8px 12px;cursor:pointer;flex-shrink:0;font-weight:600}
.done-block{text-align:center;padding:4px 0}
.done-block .di{font-size:38px;margin-bottom:6px}
.done-block .dm{font-size:14px;font-weight:700;color:var(--g)}
.done-block .ds{font-size:12px;color:#aaa;margin-top:2px}
.trophy-block{text-align:center;padding:8px 0}
.trophy-block .ti{font-size:48px;margin-bottom:6px}
.trophy-block .tm{font-size:16px;font-weight:800;color:var(--t)}
.trophy-block .ts{font-size:12px;color:#aaa;margin-top:2px}

/* overview table */
.ov-btn{display:inline-block;margin:12px auto 0;padding:8px 20px;border-radius:16px;border:1px solid #ddd;background:#fff;font-size:12px;font-weight:600;color:#888;cursor:pointer;transition:.15s}
.ov-btn:active{background:#f8f8ff}
.ov-panel{display:none;margin-top:10px;background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.05);overflow:hidden;width:100%}
.ov-panel.open{display:block}
.ov-head{display:flex;align-items:center;gap:6px;padding:10px 16px;background:#faf8ff;font-size:13px;font-weight:700;color:var(--p);border-bottom:1px solid #ece6ff}
.ov-head span{flex:1}
.ov-row{display:flex;align-items:center;padding:9px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:.12s;font-size:13px}
.ov-row:hover{background:#fdfbff}
.ov-row:last-child{border-bottom:0}
.ov-f{font-weight:700;color:var(--p);min-width:60px;font-size:14px}
.ov-m{color:var(--td);margin-left:8px;font-size:12px}
.ov-w{color:#999;font-size:11px;flex:1;text-align:right}
.ov-spk{cursor:pointer;opacity:.25;font-size:13px;margin-left:6px;flex-shrink:0}
.ov-spk:active{opacity:1}
.back-link{display:block;text-align:center;padding:12px;font-size:12px;color:#bbb;text-decoration:none}
.back-link:hover{color:var(--p)}
</style>
</head>
<body>
<div class="main">
 <div class="camp">
  <div class="banner">
   <div class="title">🧩 词根词缀训练营</div>
   <div class="sub">每天5分钟 · 举一反三记单词</div>
  </div>
  <div class="tabs">
   <button class="tab active" onclick="switchTab('prefix')">🔷 前缀<div class="cnt"></div></button>
   <button class="tab" onclick="switchTab('suffix')">🔰 后缀<div class="cnt"></div></button>
   <button class="tab" onclick="switchTab('root')">🧱 词根<div class="cnt"></div></button>
  </div>
  <div class="pbar">
   <div class="pt"><div class="pf" id="pf" style="width:0%"></div></div>
   <div class="pn" id="pn">0/0</div>
  </div>
  <div class="cbody" id="cbody"></div>
 </div>

 <button class="ov-btn" onclick="toggleOV()">📋 词根词缀总览表 ▸</button>
 <div class="ov-panel" id="ovPanel"></div>

 <a class="back-link" href="index.html">← 回到拼读训练营</a>
</div>

<script>
var M=[],done={},tab='prefix',idx=0,ovOpen=false;
function load(){
 try{
  M=JSON.parse(document.getElementById('md').textContent);
  var s=localStorage.getItem('dl_md3');if(s)done=JSON.parse(s);
 }catch(e){M=[];}
 switchTab('prefix');
}
function sv(){localStorage.setItem('dl_md3',JSON.stringify(done));}
function isDone(id){return done[id]||false;}

function switchTab(t){
 tab=t;idx=0;
 var data=M.filter(function(m){return m.type===tab;});
 for(var j=0;j<data.length;j++){if(!isDone(data[j].id)){idx=j;break;}}
 if(data.length>0&&j>=data.length)idx=data.length-1;
 document.querySelectorAll('.tab').forEach(function(b){
  b.classList.toggle('active',
   (b.textContent.indexOf('前缀')!==-1&&t==='prefix')||
   (b.textContent.indexOf('后缀')!==-1&&t==='suffix')||
   (b.textContent.indexOf('词根')!==-1&&t==='root'));
 });
 render();renderOV();
}

function render(){
 var data=M.filter(function(m){return m.type===tab;});
 var total=data.length;
 var cnt=data.filter(function(m){return isDone(m.id);}).length;
 var pct=total?(cnt/total*100):0;
 document.getElementById('pf').style.width=pct+'%';
 document.getElementById('pn').textContent=cnt+'/'+total;
 ['prefix','suffix','root'].forEach(function(t){
  document.querySelectorAll('.tab').forEach(function(b){
   if((t==='prefix'&&b.textContent.indexOf('前缀')!==-1)||(t==='suffix'&&b.textContent.indexOf('后缀')!==-1)||(t==='root'&&b.textContent.indexOf('词根')!==-1)){
    var el=b.querySelector('.cnt');if(el)el.textContent=M.filter(function(m){return m.type===t;}).length+'节';
   }
  });
 });

 if(cnt>=total){
  document.getElementById('cbody').innerHTML='<div class="trophy-block"><div class="ti">🏆</div><div class="tm">全部完成</div><div class="ts">'+cnt+'/'+total+' 节已掌握</div></div>';
  return;
 }

 var m=data[idx];
 if(isDone(m.id)){
  var h='<div class="done-block"><div class="di">✅</div><div class="dm">'+hx(m.form)+'</div><div class="ds">'+hx(m.meaning)+' · 已掌握</div>';
  h+='<div style="margin-top:14px"><button class="btn-fwd" onclick="next()">继续 →</button></div></div>';
  document.getElementById('cbody').innerHTML=h;
  return;
 }

 var html='<div class="badge">第'+(idx+1)+'节 · '+(tab==='prefix'?'前缀':tab==='suffix'?'后缀':'词根')+'</div>';
 html+='<div class="word">'+hx(m.form)+'</div>';
 html+='<div class="meaning">'+hx(m.meaning)+'</div>';
 html+='<div class="desc">💡 '+hx(m.desc)+'</div>';

 html+='<div class="slabel">示例词</div><div class="chips">';
 m.words.forEach(function(w){
  var we=w.replace(/'/g,"\\'");
  html+='<span class="chip" onclick="sp(\''+we+'\')">'+hx(w)+' <span class="ik">🔊</span></span>';
 });
 html+='</div>';

 html+='<div class="slabel">例句</div><div class="exlist">';
 m.sentences.forEach(function(s){
  var se=s[0].replace(/'/g,"\\'");
  html+='<div class="exrow"><span class="exen">'+hx(s[0])+'</span><span class="exzh">'+hx(s[1])+'</span><span class="exspk" onclick="sp(\''+se+'\')">🔊</span></div>';
 });
 html+='</div>';

 html+='<div class="nav">';
 if(idx>0)html+='<button class="btn-back" onclick="prev()">◀</button>';
 html+='<button class="btn-learn" onclick="markDone()">✅&nbsp;我学会了</button>';
 html+='</div>';
 document.getElementById('cbody').innerHTML=html;
}

function toggleOV(){
 ovOpen=!ovOpen;
 var p=document.getElementById('ovPanel');
 p.classList.toggle('open',ovOpen);
 var btn=document.querySelector('.ov-btn');
 btn.innerHTML=ovOpen?'📋 词根词缀总览表 ▾':'📋 词根词缀总览表 ▸';
 if(ovOpen)renderOV();
}

function renderOV(){
 if(!ovOpen)return;
 var types=[
  {key:'prefix',label:'🔷 前缀',col:'#7c5ce7'},
  {key:'suffix',label:'🔰 后缀',col:'#00b894'},
  {key:'root',label:'🧱 词根',col:'#e17c00'}
 ];
 var h='';
 types.forEach(function(tp){
  var items=M.filter(function(m){return m.type===tp.key;});
  if(!items.length)return;
  h+='<div class="ov-head" style="color:'+tp.col+'"><span>'+tp.label+' （'+items.length+'个）</span></div>';
  items.forEach(function(m){
   var we=m.words.slice(0,3).join(', ');
   var fesc=m.form.replace(/'/g,"\\'");
   h+='<div class="ov-row" onclick="smoothJump(\''+tp.key+'\',\''+m.id+'\')">';
   h+='<span class="ov-f" style="color:'+tp.col+'">'+hx(m.form)+'</span>';
   h+='<span class="ov-m">'+hx(m.meaning.split(' ')[0])+'</span>';
   h+='<span class="ov-w">'+hx(we)+'</span>';
   h+='<span class="ov-spk" onclick="event.stopPropagation();sp(\''+fesc+'\')">🔊</span>';
   h+='</div>';
  });
 });
 document.getElementById('ovPanel').innerHTML=h;
}

function smoothJump(t,mId){
 tab=t;idx=0;
 var data=M.filter(function(m){return m.type===tab;});
 for(var i=0;i<data.length;i++){if(data[i].id===mId){idx=i;break;}}
 document.querySelectorAll('.tab').forEach(function(b){
  b.classList.toggle('active',
   (b.textContent.indexOf('前缀')!==-1&&t==='prefix')||
   (b.textContent.indexOf('后缀')!==-1&&t==='suffix')||
   (b.textContent.indexOf('词根')!==-1&&t==='root'));
 });
 render();
 ovOpen=false;
 document.getElementById('ovPanel').classList.remove('open');
 document.querySelector('.ov-btn').innerHTML='📋 词根词缀总览表 ▸';
 window.scrollTo({top:0,behavior:'smooth'});
}

function markDone(){
 var data=M.filter(function(m){return m.type===tab;});
 if(idx>=data.length)return;
 done[data[idx].id]=true;sv();next();
}
function next(){
 var data=M.filter(function(m){return m.type===tab;});
 for(var i=idx+1;i<data.length;i++){if(!isDone(data[i].id)){idx=i;render();return;}}
 for(var i=0;i<data.length;i++){if(!isDone(data[i].id)){idx=i;render();return;}}
 idx=data.length-1;render();
}
function prev(){if(idx>0){idx--;render();}}
function sp(w){
 if(window.speechSynthesis){
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.82;
  window.speechSynthesis.speak(u);
 }
}
function hx(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
window.addEventListener('DOMContentLoaded',function(){load();});
</script>
