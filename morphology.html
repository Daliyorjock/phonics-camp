<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DeepLingual · 词根词缀训练营</title>
<style>
:root{--p:#7c5ce7;--g:#00b894;--t:#1e1e2e;--td:#666;--bg:#f5f2ff}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;-webkit-tap-highlight-color:transparent}
.header{text-align:center;padding:22px 16px 14px;background:linear-gradient(135deg,var(--p),var(--g));color:#fff}
.header h1{font-size:20px;margin:0 0 2px;font-weight:800}
.header p{font-size:12px;opacity:.85;margin:0}
.tab-bar{display:flex;gap:0;background:#fff;border-radius:14px;margin:14px 12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:8px;z-index:10}
.tab-btn{flex:1;border:0;padding:13px 8px;font-size:14px;font-weight:600;background:transparent;color:#888;cursor:pointer;border-bottom:3px solid transparent;text-align:center}
.tab-btn.active{color:var(--p);border-bottom-color:var(--p)}
.tab-btn .tab-count{font-size:11px;color:#aaa;display:block;font-weight:400}
.progress-bar{display:flex;align-items:center;gap:10px;padding:4px 16px 12px;max-width:560px;margin:0 auto}
.progress-track{flex:1;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--g));border-radius:3px;transition:width .4s}
.progress-num{font-size:12px;font-weight:700;color:#888;min-width:42px;text-align:right}
.lesson-wrap{padding:0 12px 24px;max-width:560px;margin:0 auto}
.lesson-card{background:#fff;border-radius:16px;padding:20px 16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:14px;position:relative;transition:.2s}
.lesson-card.locked{opacity:.55;filter:grayscale(.4)}
.lesson-card.locked::after{content:'🔒';position:absolute;top:14px;right:14px;font-size:20px}
.lesson-card.done{border-left:4px solid var(--g)}
.lesson-num{font-size:11px;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.lesson-form{font-size:22px;font-weight:800;color:var(--t);margin-bottom:2px;letter-spacing:.5px}
.lesson-meaning{font-size:14px;color:var(--td);margin-bottom:8px}
.lesson-desc{font-size:12px;color:#999;margin-bottom:14px;line-height:1.6;background:#faf8ff;border-radius:8px;padding:8px 10px}
.lesson-label{font-size:11px;font-weight:700;color:#aaa;margin:12px 0 6px;letter-spacing:.5px}
.word-chips{display:flex;flex-wrap:wrap;gap:6px}
.word-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:#f5f2ff;border-radius:16px;font-size:13px;font-weight:600;color:var(--p);cursor:pointer;border:1px solid #e8e4f5;transition:all .15s}
.word-chip:active{transform:scale(.97);background:#ede4ff}
.word-chip .speak{font-size:10px;opacity:.6}
.ex-list{display:flex;flex-direction:column;gap:4px}
.ex-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fafafa;border-radius:8px;font-size:12px}
.ex-en{font-weight:600;color:#333;flex:1;line-height:1.5}
.ex-zh{color:#999;font-size:11px;white-space:nowrap}
.ex-speak{cursor:pointer;opacity:.4;font-size:14px;flex-shrink:0}
.ex-speak:active{opacity:1}
.btn-done{display:block;width:100%;padding:10px;border:0;border-radius:20px;background:var(--p);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;transition:all .15s}
.btn-done:active{transform:scale(.98);opacity:.8}
.btn-done.did{background:var(--g)}
.lesson-card.locked .btn-done{pointer-events:none;opacity:.5}
.back-link{display:block;text-align:center;padding:8px;font-size:12px;color:#aaa;text-decoration:none;margin-bottom:12px}
.back-link:hover{color:var(--p)}
.empty-msg{text-align:center;color:#bbb;padding:40px 16px;font-size:14px}
</style>
</head>
<body>
<div class="header">
<h1>🧩 词根词缀训练营</h1>
<p>一节节学，举一反三</p>
</div>
<div class="progress-bar">
<div class="progress-track"><div class="progress-fill" id="pf" style="width:0%"></div></div>
<div class="progress-num" id="pn">0/0</div>
</div>
<div class="tab-bar">
<button class="tab-btn active" onclick="switchTab('prefix')">🔷 前缀<span class="tab-count"></span></button>
<button class="tab-btn" onclick="switchTab('suffix')">🔰 后缀<span class="tab-count"></span></button>
<button class="tab-btn" onclick="switchTab('root')">🧱 词根<span class="tab-count"></span></button>
</div>
<div class="lesson-wrap" id="lessonList"></div>
<a class="back-link" href="index.html">← 回到拼读训练营</a>

<script>
var M=[];
var done={};
var tab='prefix';

function load(){
  M=JSON.parse(document.getElementById('md').textContent);
  var s=localStorage.getItem('dl_morph_done');
  if(s)done=JSON.parse(s);
  switchTab(tab);
}
function save(){localStorage.setItem('dl_morph_done',JSON.stringify(done));}
function isDone(id){return done[id]||false;}
function markDone(id){done[id]=true;save();render();}

function switchTab(t){
  tab=t;
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('active',
      (i===0&&t==='prefix')||(i===1&&t==='suffix')||(i===2&&t==='root'));
  });
  render();
}

function render(){
  var data=M.filter(function(m){return m.type===tab;});
  var total=data.length;
  var cnt=data.filter(function(m){return isDone(m.id);}).length;

  document.getElementById('pf').style.width=total?(cnt/total*100)+'%':'0%';
  document.getElementById('pn').textContent=cnt+'/'+total;

  var html='';
  var prevDone=true;
  data.forEach(function(m,i){
    var locked=!prevDone;
    var d=isDone(m.id);
    if(d)locked=false;
    prevDone=d;
    var cls=d?'done':(locked?'locked':'');
    var encId=m.id.replace(/'/g,"\\'");

    html+='<div class="lesson-card '+cls+'">';
    html+='<div class="lesson-num">第'+(i+1)+'节</div>';
    html+='<div class="lesson-form">'+h(m.form)+'</div>';
    html+='<div class="lesson-meaning">'+h(m.meaning)+'</div>';
    html+='<div class="lesson-desc">💡 '+h(m.desc)+'</div>';

    if(!locked){
      html+='<div class="lesson-label">📝 示例词</div>';
      html+='<div class="word-chips">';
      m.words.forEach(function(w){
        var we=w.replace(/'/g,"\\'");
        html+='<span class="word-chip" onclick="sp(\''+we+'\')">'+h(w)+'<span class="speak">🔊</span></span>';
      });
      html+='</div>';
      html+='<div class="lesson-label">📖 例句</div>';
      html+='<div class="ex-list">';
      m.sentences.forEach(function(s){
        var se=s[0].replace(/'/g,"\\'");
        html+='<div class="ex-item"><span class="ex-en">'+h(s[0])+'</span><span class="ex-zh">'+h(s[1])+'</span><span class="ex-speak" onclick="sp(\''+se+'\')">🔊</span></div>';
      });
      html+='</div>';
    }

    if(d){
      html+='<button class="btn-done did">✅ 已掌握</button>';
    }else if(!locked){
      html+='<button class="btn-done" onclick="markDone(\''+encId+'\')">✅ 我学会了</button>';
    }else{
      html+='<button class="btn-done">🔒 先学前一节</button>';
    }

    html+='</div>';
  });

  if(!data.length)html='<div class="empty-msg">暂无内容</div>';
  document.getElementById('lessonList').innerHTML=html;

  // update tab counts
  ['prefix','suffix','root'].forEach(function(t){
    var c=M.filter(function(m){return m.type===t;}).length;
    document.querySelectorAll('.tab-btn').forEach(function(b){
      var txt=b.textContent.trim();
      if((t==='prefix'&&txt.indexOf('前缀')!==-1)||(t==='suffix'&&txt.indexOf('后缀')!==-1)||(t==='root'&&txt.indexOf('词根')!==-1)){
        var el=b.querySelector('.tab-count');if(el)el.textContent=c+'节';
      }
    });
  });
}

function sp(w){
  if(window.speechSynthesis){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(w);
    u.lang='en-US';u.rate=.82;
    window.speechSynthesis.speak(u);
  }
}
function h(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
load();
</script>

rnational","interrupt","internet","intercept"],"sentences":[["Kids should interact more outside.","孩子应该多在外面互动。"],["I have a job interview tomorrow.","我明天有工作面试。"],["This is an international flight.","这是国际航班。"]]},{"id":"m_en","form":"en-","type":"prefix","meaning":"使成为 / 放进 make/put","desc":"表示「使…进入状态」","words":["enable","enrich","enforce","engage","enroll","encase"],"sentences":[["This tool will enable faster work.","这个工具能提高工作效率。"],["Reading enriches your mind.","阅读丰富你的思维。"],["Police enforce the traffic law.","警察执行交通法规。"]]},{"id":"m_anti","form":"anti-","type":"prefix","meaning":"反对 / 对抗 against","desc":"表示「反对、对抗」","words":["antivirus","antibacterial","antifreeze","antisocial","antibiotic","antioxidant"],"sentences":[["Install antivirus software on your PC.","在电脑上安装杀毒软件。"],["Wash with antibacterial soap.","用抗菌皂清洗。"],["Add antifreeze to the engine.","给引擎加防冻液。"]]},{"id":"m_bene","form":"bene-","type":"prefix","meaning":"好的 / 善的 good","desc":"表示「好、善」","words":["benefit","benevolent","beneficial","benefactor"],"sentences":[["Exercise has many benefits.","锻炼有很多好处。"],["She is a benevolent leader.","她是一位仁慈的领导者。"],["This change is beneficial to all.","这个变化对所有人有益。"]]},{"id":"m_over","form":"over-","type":"prefix","meaning":"过度 / 超过 too much","desc":"表示「过度、超过」","words":["overthink","overwork","overflow","overload","overlook","overcome"],"sentences":[["Don't overthink the problem.","不要过度思考这个问题。"],["The river may overflow in rain.","下雨时河水可能溢出。"],["We can overcome this challenge.","我们能克服这个挑战。"]]},{"id":"m_sub","form":"sub-","type":"prefix","meaning":"在…下面 / 次于 under","desc":"表示「在下面、次于」","words":["subway","submarine","subtitle","substandard","submerge","subordinate"],"sentences":[["Take the subway to downtown.","坐地铁去市中心。"],["Add subtitles to the video.","给视频加字幕。"],["The toy can submerge in water.","玩具可以在水中下潜。"]]},{"id":"m_in","form":"in-","type":"prefix","meaning":"不 / 向内 not/into","desc":"表示「不、向内」（也有 il-/ir-/im- 变体）","words":["inactive","incomplete","indirect","illegal","irregula es":[["My teacher is very patient.","我的老师很有耐心。"],["He is a good football player.","他是好足球运动员。"],["The factory needs more workers.","工厂需要更多工人。"]]},{"id":"m_ly","form":"-ly","type":"suffix","meaning":"…地 manner","desc":"表示「方式、程度」构成副词","words":["quickly","happily","finally","really","suddenly","slowly"],"sentences":[["She finished the task quickly.","她很快完成了任务。"],["They lived happily ever after.","他们从此幸福地生活。"],["Finally, we reached the top.","最后，我们到达了山顶。"]]},{"id":"m_ness","form":"-ness","type":"suffix","meaning":"…的状态/性质 state","desc":"表示「状态、性质」","words":["happiness","kindness","darkness","weakness","thickness","awareness"],"sentences":[["True happiness comes from love.","真正的幸福来自爱。"],["Show kindness to everyone.","对每个人都友善。"],["We walked into the darkness.","我们走进了黑暗中。"]]},{"id":"m_ous","form":"-ous","type":"suffix","meaning":"有…性质的 having","desc":"表示「充满、具有…性质」","words":["famous","dangerous","curious","nervous","generous","humorous"],"sentences":[["She is a famous singer.","她是著名歌手。"],["Snakes can be dangerous.","蛇可能很危险。"],["I'm curious about science.","我对科学很好奇。"]]},{"id":"m_ive","form":"-ive","type":"suffix","meaning":"有…倾向的 tending to","desc":"表示「有…倾向或性质的」","words":["active","creative","positive","negative","effective","attractive"],"sentences":[["Stay active for good health.","保持活跃才有好健康。"],["She has many creative ideas.","她有很多创意。"],["Give positive feedback to your team.","给你的团队正面反馈。"]]},{"id":"m_ist","form":"-ist","type":"suffix","meaning":"…者/…的人 person","desc":"表示「从事…的人」","words":["artist","scientist","pianist","tourist","dentist","optimist"],"sentences":[["He wants to be an artist.","他想成为艺术家。"],["Scientists do important research.","科学家做重要研究。"],["The tourist asked for directions.","游客问了路。"]]},{"id":"m_al","form":"-al","type":"suffix","meaning":"…的 / 属于… of/pertaining to","desc":"表示「与…有关的」","words":["natural","personal","national","professional","emotional","cultural"],"sentences":[["We love natural scenery.","我们爱自然风光。"],["This is my personal opinion.","这是我个人意见。"],["It
